inherit_from: .rubocop_todo.yml

AllCops:
  DisplayCopNames: true
  # The newest version RuboCop 0.81 knows. Without it, RuboCop reads the Ruby
  # version from .ruby-version or Gemfile.lock and fails on Ruby 3.x.
  TargetRubyVersion: 2.7
  Exclude:
    - 'spec/support/protos/*.pb.rb'
    - 'varint_prof.rb'

Bundler/DuplicatedGem:
  Enabled: false

Layout/EndAlignment:
  EnforcedStyleAlignWith: keyword

Lint/Loop:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Layout/CaseIndentation:
  EnforcedStyle: end

Style/ClassAndModuleChildren:
  Exclude:
    - '**/*.pb.rb'
    - 'spec/**/*.rb'

Naming/ClassAndModuleCamelCase:
  Exclude:
    - '**/*.pb.rb'

Layout/EmptyLineBetweenDefs:
  AllowAdjacentOneLineDefs: true

Layout/EmptyLines:
  Exclude:
    - '**/*.pb.rb'

Naming/FileName:
  Exclude:
    - '**/protoc-gen-ruby*'

Style/GuardClause:
  MinBodyLength: 4

Style/HashSyntax:
  EnforcedStyle: hash_rockets

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Style/Semicolon:
  AllowAsExpressionSeparator: true

Style/SingleLineBlockParams:
  Enabled: false

Layout/TrailingEmptyLines:
  Exclude:
    - '**/*.pb.rb'

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

Style/TrivialAccessors:
  AllowDSLWriters: true
  AllowPredicates: true

Style/Encoding:
  Exclude:
    - '**/*.pb.rb'

# TargetRubyVersion (2.7) cannot match required_ruby_version (>= 3.1), because
# RuboCop 0.81 does not know Ruby 3.x.
Gemspec/RequiredRubyVersion:
  Enabled: false
