name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Newer protoc versions reject the explicit `map_entry` option in the spec protos.
  PROTOC_VERSION: "3.16.0"

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
        rails: ["6.0", "6.1", "7.0", "7.1", "7.2", "8.0", "8.1"]
        exclude:
          # Rails 8.0+ requires Ruby 3.2+.
          - { ruby: "3.1", rails: "8.0" }
          - { ruby: "3.1", rails: "8.1" }
          # Rails 6.x does not load on Ruby 3.4: it needs bigdecimal, which is
          # no longer a default gem, and does not declare it.
          - { ruby: "3.4", rails: "6.0" }
          - { ruby: "3.4", rails: "6.1" }
    env:
      RAILS_VERSION: "~> ${{ matrix.rails }}.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install ZeroMQ
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          archive="protoc-${PROTOC_VERSION}-linux-x86_64"
          curl -sSL -o "/tmp/${archive}.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${archive}.zip"
          sudo unzip -q -o -d /usr/local "/tmp/${archive}.zip" 'bin/*' 'include/*'
          sudo chmod -R a+rX /usr/local/bin/protoc /usr/local/include/google
          protoc --version

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Compile protos
        run: bundle exec rake compile:spec compile:rpc

      - name: Check compiled protos are committed
        run: git diff --exit-code

      - name: Run specs
        run: bundle exec rspec
