version: 2.1

jobs:
  rubocop:
    docker:
      # RuboCop 0.81 does not load on Ruby 4.0 (it needs the benchmark gem).
      - image: cimg/ruby:3.4
    steps:
      - checkout
      - run:
          name: Install gems
          command: bundle install --jobs 4 --retry 3
      - run:
          name: RuboCop
          command: bundle exec rubocop

  test:
    parameters:
      ruby:
        type: string
      rails:
        type: string
    docker:
      - image: cimg/ruby:<< parameters.ruby >>
    environment:
      # Newer protoc versions reject the explicit `map_entry` option in the spec protos.
      PROTOC_VERSION: "3.16.0"
      RAILS_VERSION: "~> << parameters.rails >>.0"
    steps:
      - checkout
      - run:
          name: Install ZeroMQ
          command: sudo apt-get update && sudo apt-get install -y libzmq3-dev
      - run:
          name: Install protoc
          command: |
            archive="protoc-${PROTOC_VERSION}-linux-x86_64"
            curl -sSL -o "/tmp/${archive}.zip" \
              "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${archive}.zip"
            sudo unzip -q -o -d /usr/local "/tmp/${archive}.zip" 'bin/*' 'include/*'
            sudo chmod -R a+rX /usr/local/bin/protoc /usr/local/include/google
            protoc --version
      # Gemfile.lock is not committed, so each job resolves gems for its own
      # Ruby and RAILS_VERSION.
      - run:
          name: Install gems
          command: bundle install --jobs 4 --retry 3
      - run:
          name: Compile protos
          command: bundle exec rake compile:spec compile:rpc
      - run:
          name: Check compiled protos are committed
          command: git diff --exit-code
      - run:
          name: Run specs
          command: bundle exec rspec

  test-jruby:
    parameters:
      jruby:
        type: string
      rails:
        type: string
    docker:
      - image: jruby:<< parameters.jruby >>
    environment:
      PROTOC_VERSION: "3.16.0"
      RAILS_VERSION: "~> << parameters.rails >>.0"
      JRUBY_OPTS: "--dev"
    steps:
      # The jruby image has no git, so install it before checkout.
      - run:
          name: Install system packages
          command: apt-get update && apt-get install -y git unzip build-essential libzmq3-dev
      - checkout
      - run:
          name: Install protoc
          command: |
            archive="protoc-${PROTOC_VERSION}-linux-x86_64"
            curl -sSL -o "/tmp/${archive}.zip" \
              "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${archive}.zip"
            unzip -q -o -d /usr/local "/tmp/${archive}.zip" 'bin/*' 'include/*'
            protoc --version
      - run:
          name: Install gems
          command: bundle install --jobs 4 --retry 3
      - run:
          name: Compile protos
          command: bundle exec rake compile:spec compile:rpc
      - run:
          name: Check compiled protos are committed
          command: git diff --exit-code
      - run:
          name: Run specs
          command: bundle exec rspec

workflows:
  build_and_test:
    jobs:
      - rubocop
      - test:
          name: test-ruby-<< matrix.ruby >>-rails-<< matrix.rails >>
          matrix:
            parameters:
              ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
              rails: ["6.0", "6.1", "7.0", "7.1", "7.2", "8.0", "8.1"]
            exclude:
              # Rails 8.0+ requires Ruby 3.2+.
              - { ruby: "3.1", rails: "8.0" }
              - { ruby: "3.1", rails: "8.1" }
              # Rails 6.x does not load on Ruby 3.4+: it needs bigdecimal and
              # logger, which are no longer default gems, and does not declare them.
              - { ruby: "3.4", rails: "6.0" }
              - { ruby: "3.4", rails: "6.1" }
              - { ruby: "4.0", rails: "6.0" }
              - { ruby: "4.0", rails: "6.1" }
      - test-jruby:
          name: test-jruby-<< matrix.jruby >>-rails-<< matrix.rails >>
          matrix:
            parameters:
              # JRuby 9.4 is Ruby 3.1; JRuby 10.0 is Ruby 3.4.
              jruby: ["9.4", "10.0"]
              rails: ["6.1", "7.1", "7.2", "8.0", "8.1"]
            exclude:
              # Rails 8.0+ requires Ruby 3.2+.
              - { jruby: "9.4", rails: "8.0" }
              - { jruby: "9.4", rails: "8.1" }
              # Rails 6.x does not load on Ruby 3.4 (base64 and bigdecimal are
              # no longer default gems).
              - { jruby: "10.0", rails: "6.1" }
